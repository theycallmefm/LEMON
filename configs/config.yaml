experiment_name: "experiment/skull/spiderman-ip2p06-n02-condrender-inputgt"
input_dir: "./data/dtu-512-384/65_skull/views"
input_bbox: "./data/dtu-512-384/65_skull/bbox.txt"
output_dir: "./out/"
initial_mesh: "vh32"
image_scale: 1.0
iterations: 20000
lr_vertices: 1.0e-3
lr_shader: 1.0e-3
upsample_iterations: [500, 1000, 1500]
save_frequency: 500
visualization_frequency: 500
visualization_views: []
device: 0
weight_mask: 2.0
weight_normal: 0.4
weight_laplacian: 40.0
weight_shading: 1.0
shading_percentage: 0.75
hidden_features_layers: 3
hidden_features_size: 256
fourier_features: "positional"
activation: "relu"
fft_scale: 4
#freenerf #NOT IMPORTANT
L: 4 #L_max = 2 * 3 * self.L + 3 
T: 20000 
#diffusion
pipeline: "our-mcnet"
cfg_text: 7.5 #guidance scale for controlnet
weight_chamfer: 0.0 #this replaces shading weight after editing starts
chamfer_percentage: 0.5
prompt: "Turn it into Spider-Man"
negative_prompt: ""
#latent weight scheduling
latent_step: 0.00
latent_weight: 0.5
max_latent_weight: 0.91
min_latent_weight: 0.1
latent_change_interval: 2000
# controlnet conditioning
controlnet: ["ip2p","normal"]
conditioning_scale: [0.8, 0.2]
ip2p_use_full_precision: 0
seed: 42
steps: 10
edit_begin: 2000
edit_frequency: 10 #dataset is sequential for now, only 13 works in buddha/owl, look prima module factor if you want to change it https://en.wikipedia.org/wiki/Primitive_root_modulo_n
edit_save_frequency: 500
comment: "controlnet input:0.9 render latent + 0.1 normal_latent + random noise, condition:original,normal 512 size without crop"
# Benchmark
benchmark: true
benchmark_dir: "./benchmark/imgs/skull-spiderman"
